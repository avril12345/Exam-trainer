<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 4 Sparky Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan: job-site control panel. Slate + safety amber. Lexend body for readability, Barlow Condensed for signage-style headings.
   One question per screen, big tap targets, bottom nav like a phone app. */
:root{
  --bg:#f6f1e4;        /* cream: easier reading for dyslexia */
  --panel:#fffaf0;
  --ink:#1d2430;
  --muted:#5b6473;
  --line:#d9cfb8;
  --acc:#c98a00;       /* safety amber */
  --acc-ink:#1d2430;
  --acc-soft:#f4e2b4;
  --good:#2f8a4c; --good-soft:#d7eedc;
  --bad:#c0392b;  --bad-soft:#f6d9d5;
  /* quantity colours: always the same in every formula */
  --qv:#1f6fd1; --qi:#c62f3a; --qr:#b86a00; --qp:#2f8a4c; --qf:#7a4fc4; --qk:#0f8a8a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Lexend",Verdana,Arial,sans-serif;
  --fs:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161d; --panel:#1a212b; --ink:#eef1f5; --muted:#a3adbb; --line:#2c3644;
    --acc:#f5b700; --acc-ink:#11161d; --acc-soft:#3a3218;
    --good:#4cc275; --good-soft:#173322; --bad:#ff6b5e; --bad-soft:#3a1c1a;
    --qv:#5aa7ff; --qi:#ff6b75; --qr:#ffaa3b; --qp:#58d68d; --qf:#b493ff; --qk:#3dd6d0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161d; --panel:#1a212b; --ink:#eef1f5; --muted:#a3adbb; --line:#2c3644;
  --acc:#f5b700; --acc-ink:#11161d; --acc-soft:#3a3218;
  --good:#4cc275; --good-soft:#173322; --bad:#ff6b5e; --bad-soft:#3a1c1a;
  --qv:#5aa7ff; --qi:#ff6b75; --qr:#ffaa3b; --qp:#58d68d; --qf:#b493ff; --qk:#3dd6d0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.6;letter-spacing:.01em;word-spacing:.06em}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.6rem} h3{font-size:1.25rem}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.bolt{width:34px;height:34px;border-radius:8px;background:var(--acc);display:grid;place-items:center}
.bolt svg{width:20px;height:20px}
.tools{display:flex;gap:6px}
@media (max-width:420px){.sub{display:none}.brand h1{font-size:1.25rem !important}.bolt{width:30px;height:30px}.ibtn{min-width:40px;padding:0 6px}}
.ibtn{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;padding:0 10px;font-size:.9rem}
.ibtn:hover{border-color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.8rem;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.chip.t1{border-color:var(--qv);color:var(--qv)}
.chip.t2{border-color:var(--qp);color:var(--qp)}
.chip.chk{border-color:var(--acc);background:var(--acc-soft);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 20px;border-radius:12px;border:2px solid var(--acc);background:var(--acc);color:var(--acc-ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--acc)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
/* level */
.level{display:grid;gap:8px}
.bar{height:12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;padding:10px 6px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-height:130px}
.tile:hover{border-color:var(--acc)}
.tile .ic{width:46px;height:46px;border-radius:10px;background:var(--acc-soft);display:grid;place-items:center}
.tile .ic svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:2}
.tile b{font-family:var(--display);font-size:1.3rem;letter-spacing:.02em}
.tile span{display:block;font-size:.85rem;color:var(--muted);line-height:1.35}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:auto;gap:14px}
@media (max-width:420px){.tiles{grid-template-columns:1fr}.tile{min-height:auto;flex-direction:row;align-items:center;gap:14px}}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:grid;grid-template-columns:repeat(6,1fr);max-width:760px;width:100%}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;color:var(--muted);text-decoration:none;font-size:.72rem}
nav.bottom a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
nav.bottom a.on{color:var(--ink)}
nav.bottom a.on svg{stroke:var(--acc)}
/* question */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--acc)}
.qtext{font-size:1.15em;font-weight:500;line-height:1.55;max-width:62ch}
.qtext b, .key{color:var(--acc);font-weight:700}
:root:not([data-theme="dark"]) .qtext b{color:#9a5f00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qtext b{color:var(--acc)}}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--panel);cursor:pointer;min-height:56px;line-height:1.45}
.opt:hover{border-color:var(--acc)}
.opt .let{flex:0 0 30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:.9rem}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.feedback{border-left:5px solid var(--good);padding:12px 14px;border-radius:8px;background:var(--good-soft)}
.feedback.no{border-color:var(--bad);background:var(--bad-soft)}
.feedback b{font-family:var(--display);font-size:1.2rem;letter-spacing:.02em}
.timer{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:48px;border:0;background:var(--panel);cursor:pointer;padding:6px 10px}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
/* flashcards */
.card{min-height:280px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.card ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.card li::marker{color:var(--acc)}
.ref{font-size:.85rem;color:var(--muted)}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rate .btn{min-height:56px;padding:8px}
.btn.r-again{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.btn.r-ok{background:var(--acc-soft);border-color:var(--acc);color:var(--ink)}
.btn.r-good{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.boxes{display:flex;gap:6px}
.boxes span{flex:1;text-align:center;font-size:.75rem;padding:6px 2px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.boxes b{display:block;font-family:var(--display);font-size:1.2rem}
/* formula lab */
.q{font-weight:700;font-style:normal}
.q.v{color:var(--qv)} .q.i{color:var(--qi)} .q.r{color:var(--qr)} .q.p{color:var(--qp)} .q.f{color:var(--qf)} .q.k{color:var(--qk)}
.given{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gv{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);border-left-width:5px;font-variant-numeric:tabular-nums}
.gv.v{border-left-color:var(--qv)} .gv.i{border-left-color:var(--qi)} .gv.r{border-left-color:var(--qr)} .gv.p{border-left-color:var(--qp)} .gv.f{border-left-color:var(--qf)} .gv.k{border-left-color:var(--qk)}
.gv small{display:block;color:var(--muted);font-size:.75rem}
.ansrow{display:flex;gap:10px;align-items:stretch}
.ansrow input{flex:1;min-width:0;min-height:56px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:1.2rem;font-variant-numeric:tabular-nums}
.ansrow input:focus{border-color:var(--acc);outline:none}
.unit{display:grid;place-items:center;padding:0 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-weight:600}
.steps{margin:0;padding-left:1.4em;display:grid;gap:10px;font-variant-numeric:tabular-nums}
.steps li{padding-left:4px}
.steps li.hid{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem}
.lablist{display:grid;gap:8px}
.labitem{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-height:56px}
.labitem:hover{border-color:var(--acc)}
.labitem small{color:var(--muted)}
/* diagrams */
.dg{width:100%;height:auto;display:block;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
.dg .s{stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dg .a{stroke:var(--acc);fill:none;stroke-width:2.5}
.dg .fa{fill:var(--acc)} .dg .fi{fill:var(--ink)} .dg .fs{fill:var(--acc-soft)}
.dg .d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 4}
.dg text{fill:var(--ink);font-family:var(--body);font-size:12px}
.dg text.t{font-weight:600}
.dg .lab{cursor:pointer}
.dg .cover{display:none;fill:var(--acc);rx:6}
.dg .qm{display:none;fill:var(--acc-ink);font-weight:700;font-size:13px}
.hidelabels .dg .lab:not(.shown) text:not(.qm){opacity:0}
.hidelabels .dg .lab:not(.shown) .cover,.hidelabels .dg .lab:not(.shown) .qm{display:block}
.dglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.dgthumb{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.dgthumb:hover{border-color:var(--acc)}
.dgthumb svg{pointer-events:none}
.dgthumb b{font-size:.9rem;line-height:1.3}
/* symbols */
.sym{width:100%;max-width:300px;margin:0 auto;display:block;color:var(--ink)}
.sym *{vector-effect:non-scaling-stroke}
.symbox{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;place-items:center;min-height:170px}
.big{font-family:var(--display);font-size:3rem;line-height:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center}
.toast button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.hidden{display:none !important}
.say{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:40px;padding:4px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:.85rem}
.say svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.note{border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;font-size:.88rem;background:var(--acc-soft)}

.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-height:120px}
.slot:hover{border-color:var(--acc)}
.slot .num{font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--acc)}
.slot .st{font-weight:600;font-size:.9rem;line-height:1.3;flex:1}
.slot .bar{height:8px;display:block}
.ticks{display:grid;gap:8px}
.tick{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer;line-height:1.45}
.tick input{width:24px;height:24px;flex:none;accent-color:var(--good);margin-top:2px}
.tick:has(input:checked){border-color:var(--good);background:var(--good-soft)}
textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;line-height:1.5}
textarea:focus,select:focus{border-color:var(--acc);outline:none}
select{min-height:52px}
.seg.sm{margin-top:8px}.seg.sm button{min-height:44px}
.focus{border:2px solid var(--acc)}
.tile>div{display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="bolt" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="#11161d"/></svg></div>
      <div><h1 style="font-size:1.5rem;white-space:nowrap">Phase 4 Trainer</h1><div class="small muted sub">T1 Science · T2 Installation</div></div>
    </div>
    <div class="tools">
      <button class="ibtn" id="txtDown" aria-label="Smaller text">A−</button>
      <button class="ibtn" id="txtUp" aria-label="Bigger text">A+</button>
      <button class="ibtn" id="themeBtn" aria-label="Switch light or dark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="bottom" aria-label="Main">
  <div class="in">
    <a href="#home" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Home</a>
    <a href="#t2" data-v="t2"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>T2 Map</a>
    <a href="#cards" data-v="cards"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 2h14v14"/></svg>Cards</a>
    <a href="#quiz" data-v="quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Quiz</a>
    <a href="#lab" data-v="lab"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg>Lab</a>
    <a href="#pictures" data-v="pictures"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>Pictures</a>
  </div>
</nav>
<div id="toast" class="toast hidden" role="status"></div>

<script>
/* ============ storage (optional) ============ */
const store={
  get(k,d){try{const v=localStorage.getItem('p4_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('p4_'+k,JSON.stringify(v))}catch(e){}}
};
let S=store.get('state',{xp:0,answered:0,correct:0,bestShift:0,bestLab:0,streak:0,boxes:{},missed:[]});
function save(){store.set('state',S)}
function addXP(n){S.xp+=n;save()}
const LEVELS=[[0,'Apprentice'],[150,'Improver'],[400,'Advanced Improver'],[800,'Qualified Sparky'],[1500,'Master Electrician']];
function level(){let cur=LEVELS[0],next=null;for(let i=0;i<LEVELS.length;i++){if(S.xp>=LEVELS[i][0]){cur=LEVELS[i];next=LEVELS[i+1]||null}}return{cur,next}}

/* ============ settings ============ */
let fs=store.get('fs',18);
function applyFs(){document.documentElement.style.setProperty('--fs',fs+'px');store.set('fs',fs)}
applyFs();
document.getElementById('txtUp').onclick=()=>{fs=Math.min(26,fs+2);applyFs()};
document.getElementById('txtDown').onclick=()=>{fs=Math.max(14,fs-2);applyFs()};
let theme=store.get('theme',null);
function applyTheme(){if(theme)document.documentElement.setAttribute('data-theme',theme)}
applyTheme();
document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  theme=cur==='dark'?'light':'dark';store.set('theme',theme);applyTheme();
};

/* ============ read aloud ============ */
function speak(text){
  try{
    const s=window.speechSynthesis;if(!s)return toast('Read-aloud is not supported in this browser.');
    s.cancel();
    const clean=text.replace(/<[^>]+>/g,' ').replace(/\*\*/g,'').replace(/Ω/g,' ohms').replace(/µF/g,' microfarads').replace(/√/g,'root ').replace(/π/g,'pi').replace(/→/g,', ').replace(/≥/g,'at least ').replace(/≤/g,'no more than ').replace(/×/g,' times ').replace(/÷/g,' divided by ');
    const u=new SpeechSynthesisUtterance(clean);u.rate=.95;
    const vs=s.getVoices();const v=vs.find(v=>/en-IE/i.test(v.lang))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));
    if(v)u.voice=v;s.speak(u);
  }catch(e){toast('Read-aloud is not available here.')}
}
const SAY='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
function sayBtn(id){return `<button class="say" data-say="${id}" aria-label="Read aloud">${SAY} Read aloud</button>`}
let sayTexts={};
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){speak(sayTexts[b.dataset.say]||'')}});

/* ============ toast / break reminder ============ */
let toastT;
function toast(msg,btn){const t=document.getElementById('toast');t.innerHTML=`<span>${msg}</span>`+(btn?`<button id="tbtn">${btn}</button>`:'');t.classList.remove('hidden');clearTimeout(toastT);if(btn){document.getElementById('tbtn').onclick=()=>t.classList.add('hidden')}else toastT=setTimeout(()=>t.classList.add('hidden'),3200)}
let activeSince=Date.now(),lastAct=Date.now();
document.addEventListener('pointerdown',()=>{const n=Date.now();if(n-lastAct>5*60e3)activeSince=n;lastAct=n});
setInterval(()=>{if(Date.now()-activeSince>15*60e3&&Date.now()-lastAct<60e3){toast('15 minutes done. Stand up, stretch, grab a drink — 2 minute break.','Got it');activeSince=Date.now()}},30e3);

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];

<script>
/* ============ QUESTION BANK (multiple choice) ============

const MCQ=[
// ---- T1: motors
{p:'T1',t:'Motors',q:'What is the **synchronous speed** of a 4-pole motor on a 50 Hz supply?',o:['3000 rpm','1500 rpm','1000 rpm','750 rpm'],a:1,w:'n<sub>s</sub> = 120 × f ÷ poles = 120 × 50 ÷ 4 = 1500 rpm.'},
{p:'T1',t:'Motors',q:'What is the synchronous speed of an **8-pole** motor on 50 Hz?',o:['375 rpm','750 rpm','1000 rpm','1500 rpm'],a:1,w:'120 × 50 ÷ 8 = 750 rpm. More poles = slower speed.'},
{p:'T1',t:'Motors',q:'A 4-pole, 50 Hz motor runs at **1420 rpm**. What is the slip?',o:['4.000 %','5.333 %','5.634 %','8.000 %'],a:1,w:'Slip = (1500 − 1420) ÷ 1500 × 100 = 5.333 %.'},
{p:'T1',t:'Motors',q:'What does **slip** mean in an induction motor?',o:['The rotor speed in rpm','The gap between rotor and stator','The difference between synchronous speed and rotor speed, as a % of synchronous speed','The loss of one phase while running'],a:2,w:'The rotor always runs a bit slower than the rotating field. That difference is the slip.'},
{p:'T1',t:'Motors',q:'Why are motor rotors and cores **laminated**?',o:['To make them lighter','To reduce eddy current losses','To increase the speed','To improve the power factor'],a:1,w:'Thin insulated sheets break up the paths for eddy currents, so less heat and less loss.'},
{p:'T1',t:'Motors',q:'Can a **shaded-pole** motor be reversed by swapping the supply leads?',o:['Yes, swap line and neutral','Yes, swap the main winding leads','No — direction is set by where the shading rings are','Only with a capacitor added'],a:2,w:'The field always sweeps from the unshaded part of the pole to the shaded part. The rings are fixed, so the direction is fixed.'},
{p:'T1',t:'Motors',q:'In a shaded-pole motor, what is the **shading ring** made of?',o:['Laminated steel','Copper (a short-circuited ring)','Rubber','Aluminium foil tape'],a:1,w:'A thick copper ring around part of each pole. Induced current in it delays the flux in that part, creating a moving field.'},
{p:'T1',t:'Motors',q:'On a **capacitor-start** motor, what disconnects the start winding?',o:['The thermal overload','A centrifugal switch','The contactor','The MCB'],a:1,w:'At about 75 % of full speed the centrifugal switch opens and the start winding drops out.'},
{p:'T1',t:'Motors',q:'How do you **reverse** a series universal motor?',o:['Swap the two supply leads','Reverse the connections to the field OR the armature (not both)','Reverse both field and armature','It cannot be reversed'],a:1,w:'Reversing only one of them changes the direction. Reversing both leaves it the same.'},
{p:'T1',t:'Motors',q:'Maximum torque in a 3-phase induction motor happens when rotor resistance equals…',o:['Stator resistance','Rotor reactance','Supply impedance','Zero'],a:1,w:'Max torque when R₂ = X₂. A rotor-resistance (slip-ring) starter adds resistance at start to get max torque at standstill.'},
{p:'T1',t:'Motors',q:'With a **star-delta** starter, the starting current is about…',o:['the same as DOL','½ of DOL','⅓ of DOL','3 × DOL'],a:2,w:'In star each winding gets 230 V instead of 400 V, so starting current and torque drop to about one third.'},
{p:'T1',t:'Motors',q:'What is **single phasing**?',o:['Running a motor on a single-phase supply','Loss of one phase while a 3-phase motor is running','Wiring a motor in star','Using one overload for three phases'],a:1,w:'The motor keeps turning but draws too much current in the other two windings, so it overheats and can burn out.'},
{p:'T1',t:'Motors',q:'**No-volt protection** on a motor starter is there to…',o:['Stop the motor restarting by itself when power comes back','Protect against earth faults','Limit the starting current','Correct the power factor'],a:0,w:'If the supply drops, the contactor drops out. The hold-in (retaining) contact is lost, so someone has to press Start again.'},
// ---- T1: AC theory
{p:'T1',t:'AC circuits',q:'A series R-L-C circuit is at **resonance**. Which is true?',o:['X<sub>L</sub> = X<sub>C</sub>, so Z = R and current is at its maximum','X<sub>L</sub> = R','Current is at its minimum','Power factor is 0'],a:0,w:'The two reactances cancel, leaving only R. Lowest impedance → biggest current, power factor 1.'},
{p:'T1',t:'AC circuits',q:'Which formula gives the **resonant frequency**?',o:['f = 2πLC','f = 1 ÷ (2π√(LC))','f = R ÷ L','f = 1 ÷ (RC)'],a:1,w:'f₀ = 1 ÷ (2π √(L × C)). Remember to convert µF to F first.'},
{p:'T1',t:'AC circuits',q:'In a mainly **inductive** circuit the current…',o:['leads the voltage','lags the voltage','is in phase with the voltage','is always zero'],a:1,w:'Inductive = lagging. Capacitive = leading. Memory trick: CIVIL — in a C, I before V; V before I in an L.'},
{p:'T1',t:'AC circuits',q:'Power factor equals…',o:['Z ÷ R','R ÷ Z (= cos φ)','X ÷ R','V × I'],a:1,w:'pf = cos φ = R ÷ Z = True power ÷ Apparent power (P ÷ S).'},
{p:'T1',t:'AC circuits',q:'In a parallel R-L-C circuit, I<sub>R</sub> = 9 A, I<sub>L</sub> = 15 A, I<sub>C</sub> = 3 A. The circuit is…',o:['leading','lagging','at resonance','purely resistive'],a:1,w:'I<sub>L</sub> is bigger than I<sub>C</sub>, so the circuit is inductive overall → lagging.'},
{p:'T1',t:'AC circuits',q:'What does X<sub>C</sub> do when frequency goes **up**?',o:['Goes up','Goes down','Stays the same','Becomes equal to R'],a:1,w:'X<sub>C</sub> = 1 ÷ (2πfC). Higher f → smaller X<sub>C</sub>. X<sub>L</sub> does the opposite.'},
// ---- T1: three-phase
{p:'T1',t:'Three-phase',q:'In a **delta** connection, line current equals…',o:['phase current','√3 × phase current','phase current ÷ √3','3 × phase current'],a:1,w:'Delta: V<sub>L</sub> = V<sub>ph</sub>, I<sub>L</sub> = √3 × I<sub>ph</sub>.'},
{p:'T1',t:'Three-phase',q:'In a **star** connection on a 400 V supply, the phase voltage is…',o:['400 V','692.8 V','230.940 V','133.3 V'],a:2,w:'Star: V<sub>ph</sub> = V<sub>L</sub> ÷ √3 = 400 ÷ 1.732 = 230.940 V. I<sub>L</sub> = I<sub>ph</sub>.'},
{p:'T1',t:'Three-phase',q:'Total power of a balanced 3-phase load is…',o:['P = V<sub>L</sub> × I<sub>L</sub>','P = √3 × V<sub>L</sub> × I<sub>L</sub> × cos φ','P = 3 × V<sub>L</sub> × I<sub>L</sub>','P = V<sub>L</sub> ÷ I<sub>L</sub>'],a:1,w:'P = √3 V<sub>L</sub> I<sub>L</sub> cos φ. Or 3 × V<sub>ph</sub> × I<sub>ph</sub> × cos φ — same answer.'},
{p:'T1',t:'Three-phase',q:'How do you find total power with the **two-wattmeter** method?',o:['W1 − W2','W1 + W2','W1 × W2','(W1 + W2) × √3'],a:1,w:'On a 3-phase 3-wire system, total power = the sum of the two readings.'},
// ---- T1: magnetism & DC
{p:'T1',t:'Magnetism',q:'Flux density B equals…',o:['Φ × A','Φ ÷ A','A ÷ Φ','Φ ÷ length'],a:1,w:'B = Φ ÷ A, in tesla (T). Convert cm² to m² by dividing by 10,000.'},
{p:'T1',t:'Magnetism',q:'A **low-loss** magnetic material has a hysteresis loop that is…',o:['wide and fat','narrow and thin','a straight line','a circle'],a:1,w:'Narrow loop = little energy lost each cycle → good for transformer cores. Wide loop = high loss → good for permanent magnets.'},
{p:'T1',t:'DC & capacitors',q:'The **time constant** of an R-C circuit is…',o:['τ = R ÷ C','τ = R × C','τ = V ÷ R','τ = 5RC'],a:1,w:'τ = R × C (in seconds). Fully charged after about 5 time constants.'},
{p:'T1',t:'DC & capacitors',q:'68 µF in series with 47 kΩ. Time constant?',o:['0.320 s','3.196 s','31.96 s','1.446 s'],a:1,w:'68 × 10⁻⁶ × 47,000 = 3.196 s.'},
{p:'T1',t:'DC & capacitors',q:'Initial charging current of a capacitor = …',o:['V ÷ R','V × C','0','R ÷ V'],a:0,w:'At switch-on the capacitor acts like a short, so I₀ = V ÷ R.'},
// ---- T1: electronics & instruments
{p:'T1',t:'Electronics',q:'How many diodes in a **three-phase full-wave** bridge rectifier?',o:['2','3','4','6'],a:3,w:'Two diodes per phase × 3 phases = 6.'},
{p:'T1',t:'Electronics',q:'Compared with single-phase, a 3-phase rectifier has…',o:['more ripple','less ripple','the same ripple','no DC output'],a:1,w:'The peaks overlap, so the DC is much smoother (less ripple).'},
{p:'T1',t:'Electronics',q:'A **photodiode** normally works in…',o:['forward bias','reverse bias','either, no difference','only on AC'],a:1,w:'Reverse biased: light frees charge carriers and a small reverse current flows in proportion to the light.'},
{p:'T1',t:'Electronics',q:'In an NPN transistor, which current is the **largest**?',o:['Base','Collector','Emitter','They are equal'],a:2,w:'I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub>, so the emitter current is the biggest.'},
{p:'T1',t:'Electronics',q:'What causes the **depletion layer** in a P-N junction?',o:['Heat from soldering','Electrons and holes crossing the junction and recombining','The plastic case','Too much current'],a:1,w:'Near the junction, free electrons fill holes. That leaves a thin zone with no free carriers, which acts as a barrier.'},
{p:'T1',t:'Electronics',q:'An LED runs from 48 V. It needs 2 V at 20 mA. What series resistor?',o:['2.4 kΩ','2.3 kΩ','2.5 kΩ','230 Ω'],a:1,w:'R = (48 − 2) ÷ 0.020 = 2300 Ω = 2.3 kΩ.'},
{p:'T1',t:'Electronics',q:'One disadvantage of a **linear** power supply is…',o:['high electrical noise','heavy and wastes energy as heat','cannot give DC','too complicated'],a:1,w:'Advantage: simple, clean output, low noise. Disadvantage: big transformer, heavy, inefficient.'},
{p:'T1',t:'Instruments',q:'On an oscilloscope showing AC, the **X-axis** shows…',o:['voltage','time','current','frequency'],a:1,w:'X (horizontal) = time (time/div). Y (vertical) = voltage (volts/div). The Y-plates move the beam up and down.'},
{p:'T1',t:'Instruments',q:'A signal is **21.21 V RMS**. What is its peak voltage?',o:['15 V','21.21 V','30 V','42.42 V'],a:2,w:'Peak = RMS × √2 = 21.21 × 1.414 ≈ 30 V.'},

{p:'T2',t:'Cables',q:'Colour code for 3-phase cores: L1, L2, L3 are…',o:['Red, yellow, blue','Brown, black, grey','Brown, blue, green','Black, grey, blue'],a:1,w:'L1 brown, L2 black, L3 grey. Blue = neutral only. Green/yellow = protective conductor only.'},
{p:'T2',t:'Cables',q:'AC cables entering a **ferromagnetic** (steel) enclosure must be arranged so…',o:['each conductor has its own steel entry hole','all conductors of the circuit, including the CPC, go through together','only the line goes through steel','the neutral is kept separate'],a:1,w:'Conductors must only be surrounded by steel together, never one by one — otherwise eddy currents heat the steel.'},
{p:'T2',t:'Cables',q:'PVC/PVC cable will touch **expanded polystyrene** in a cavity. What do you do?',o:['Nothing, it is fine','Wrap it in tape','Put it in conduit or another barrier so it does not touch','Use a bigger cable'],a:2,w:'Polystyrene draws the plasticiser out of PVC and the insulation goes brittle. Keep them apart.'},
{p:'T2',t:'Cables',q:'Unprotected cable buried in a wall is allowed within **150 mm** of…',o:['the floor','the ceiling or a corner','any window','the DB only'],a:1,w:'Safe zones: within 150 mm of the ceiling, within 150 mm of a corner, or straight vertical/horizontal runs to an accessory. Check the exact wording in ET101.'},
{p:'T2',t:'Cables',q:'In a hollow wall, the cable must be at least ___ from the **reverse side** of the wall.',o:['10 mm','25 mm','50 mm','150 mm'],a:2,w:'Not less than 50 mm from the back face, so a screw from the other side will not hit it. Check in ET101.'},
{p:'T2',t:'Cables',q:'An aluminium conductor is about ___ as conductive as copper.',o:['30 %','61 %','90 %','120 %'],a:1,w:'About 61 %, so aluminium needs a bigger size (usually one size up) for the same current. It is lighter and cheaper.'},
{p:'T2',t:'Cables',q:'Joining aluminium to copper, you should use…',o:['a standard brass connector','a bi-metallic lug, clean and dry, with contact grease','solder','insulating tape only'],a:1,w:'Stops electrolytic corrosion. Keep it dry, clean, isolated, and torque it correctly.'},
{p:'T2',t:'Cables',q:'One advantage of **XLPE** over PVC insulation is…',o:['lower cost','higher operating temperature, so more current for the same size','softer to bend','it does not need a sheath'],a:1,w:'XLPE runs at 90 °C vs 70 °C for PVC, so it carries more current. It also lasts longer and handles overloads better.'},
{p:'T2',t:'Cables',q:'Low-voltage and **ELV** cables in the same trunking are OK if…',o:['they are different colours','every cable is insulated for the highest voltage present','the ELV is on top','the trunking is plastic'],a:1,w:'Or: separate compartments, a partition on tray, or separate conduit/trunking (ET101 528.1).'},
{p:'T2',t:'Data',q:'Maximum length of the **permanent link** (patch panel to outlet) for Cat5e/Cat6?',o:['50 m','90 m','100 m','150 m'],a:1,w:'90 m permanent link + up to 10 m of patch/work-area leads = 100 m channel.'},
{p:'T2',t:'Data',q:'What makes an **STP** cable different from UTP?',o:['It has 2 pairs','It has a foil/metal shield around the pairs','It is not twisted','It is fibre'],a:1,w:'Both have 4 twisted pairs with different twist rates and an outer jacket. STP adds a shield against interference (EMI).'},

{p:'T2',t:'Protection',q:'**Discrimination** between protective devices means…',o:['all devices trip together','the device nearest the fault (supply side) operates first','the main fuse always goes first','using only RCDs'],a:1,w:'Only the fuse/MCB just upstream of the fault should go, so the rest of the installation stays on.'},
{p:'T2',t:'Protection',q:'HBC stands for…',o:['High Breaking Capacity','Heavy Busbar Circuit','High Bonding Conductor','Heat Balanced Cartridge'],a:0,w:'HBC fuses can safely break very high fault currents, and discriminate well, so they back up MCBs.'},
{p:'T2',t:'Protection',q:'On an RCD marked **32A / 30mA / AC**, what is 30 mA?',o:['Load current rating','The residual (leakage) current that will trip it','The short-circuit rating','Trip time'],a:1,w:'32 A = how much load it can carry. 30 mA = sensitivity. AC = type (for loads with no significant DC component).'},
{p:'T2',t:'Protection',q:'An MCB has two trip actions. Overloads are handled by the…',o:['magnetic trip','thermal (bi-metal) trip','RCD','neutral link'],a:1,w:'Thermal = slow, for overloads. Magnetic = instant, for short circuits.'},
{p:'T2',t:'Protection',q:'In a **fuse-switch**…',o:['the fuse is a separate box next to the switch','the fuse link forms the moving contact','there is no fuse','the switch is inside the fuse'],a:1,w:'Fuse-switch: the fuse carrier moves as the switch blade. Switch-fuse: a switch with fuses in series in one unit.'},
{p:'T2',t:'Protection',q:'Thermistors for motor protection are fitted…',o:['in the control panel','embedded in the motor windings','on the supply cable','on the fan cover'],a:1,w:'Embedded in the windings and wired to a thermistor relay that opens the control circuit if they heat up.'},
{p:'T2',t:'Protection',q:'A thermostat\'s **bi-metallic strip** works because…',o:['the metals are magnetic','two metals expand by different amounts, so the strip bends','it melts','it is spring-loaded only'],a:1,w:'The bend opens or closes the contacts.'},

{p:'T2',t:'Motors (mechanical)',q:'A new bearing is pressed onto a shaft. The press should push on…',o:['the outer race','the inner race only','the balls','the seal'],a:1,w:'Pressing the outer race forces load through the balls and damages them. Remove old bearings with a puller.'},
{p:'T2',t:'Motors (mechanical)',q:'Alignment of a direct coupling is finally checked with…',o:['a tape measure','a feeler gauge at 4 points 90° apart','a multimeter','your eye'],a:1,w:'Straight edge first, then feeler gauge at four points. All four the same = aligned.'},
{p:'T2',t:'Motors (mechanical)',q:'A **flexible coupling** is used because it…',o:['makes the motor faster','absorbs shock, vibration and small misalignment','replaces the bearings','improves power factor'],a:1,w:'It also allows for shaft expansion.'},
{p:'T2',t:'Supplies',q:'Why is there a cheaper **Night Saver** rate?',o:['Electricity is cleaner at night','Demand is lowest overnight, so power stations sit idle','Meters run slower at night','It is a government grant'],a:1,w:'Peak is around 17:00–19:00. The valley is overnight. Cheap rates fill the valley and use plant better.'},
{p:'T2',t:'Supplies',q:'Difference between **SELV** and **PELV**?',o:['SELV is separated from earth; PELV can be earthed','PELV is higher voltage','SELV is DC only','No difference'],a:0,w:'Both are extra-low voltage. SELV is fully separated from earth; PELV is not.'},
{p:'T2',t:'Batteries',q:'10 cells of 1.5 V, each 0.2 Ω internal, feed a 4 Ω load. Current?',o:['3.750 A','2.500 A','1.500 A','15.000 A'],a:1,w:'E = 15 V. Total R = 10 × 0.2 + 4 = 6 Ω. I = 15 ÷ 6 = 2.5 A.'},
{p:'T2',t:'Batteries',q:'When testing lead-acid batteries, why is **ventilation** needed?',o:['To keep them cool','Charging gives off hydrogen, which can explode','To dry the acid','It is not needed'],a:1,w:'No naked flames. Wear goggles, rubber gloves and an apron.'},

{p:'T2',t:'Emergency lighting',q:'Quarterly test on a **3-hour** self-contained fitting: simulate mains failure for at least…',o:['5 minutes','30 minutes','1 hour','3 hours'],a:1,w:'At least 30 min (10 min for 1-hour units), but not more than a quarter of rated duration. Annual test = full rated duration.'},
{p:'T2',t:'Lighting',q:'The unit of **illuminance** is…',o:['lumen','lux (lumens per m²)','candela','watt'],a:1,w:'Luminous flux = lumens. Illuminance = lux = lumens falling on each square metre.'},
{p:'T2',t:'Lighting',q:'Low-pressure sodium (SOX) lamps are known for…',o:['excellent colour rendering','very high efficiency but poor colour (yellow light)','being instant-start','being used in hospitals'],a:1,w:'Monochromatic yellow light, so colours look wrong. Used where colour does not matter, like roads.'},
{p:'T2',t:'Heating',q:'Night storage heaters store heat in…',o:['water','high-density bricks (blocks)','oil','air'],a:1,w:'They charge on off-peak electricity. The damper controls how fast heat is released.'},
{p:'T2',t:'Testing',q:'**Main protective bonding** connects…',o:['sockets to lights','extraneous-conductive parts (water, gas pipes) to the main earthing terminal','line to neutral','the meter to the pole'],a:1,w:'It keeps all metalwork at the same potential, so dangerous touch voltages cannot build up during a fault.'},

{p:'T2',t:'IP & influences',q:'In an **IP** rating, the second digit is protection against…',o:['dust and solid objects','water','impact','fire'],a:1,w:'First digit = solids/dust. Second digit = water. E.g. IP55.'},
{p:'T2',t:'IP & influences',q:'External influence codes starting with **A** describe…',o:['environment (temperature, water, dust)','who uses it','building construction','the cable type'],a:0,w:'A = environment, B = utilisation (people), C = construction of the building. AD = water, AE = solid objects/dust.'},
{p:'T2',t:'Protection',q:'Which MCB type is for **very high** inrush current (transformers, welders)?',o:['Type B','Type C','Type D','Type AC'],a:2,w:'B trips at 3–5 × In, C at 5–10 × In, D at 10–20 × In. Bigger inrush → later letter.'},
{p:'T2',t:'Protection',q:'A Type **C** MCB trips instantly (magnetic) at about…',o:['1–2 × In','3–5 × In','5–10 × In','10–20 × In'],a:2,w:'Type C suits inductive loads like fluorescent lighting and small motors.'},
{p:'T2',t:'Protection',q:'Faults at A (near the supply), B and C (far end). Fault current is **lowest** at…',o:['A','B','C','the same everywhere'],a:2,w:'The further from the transformer, the more impedance in the loop, so the less fault current.'},
{p:'T2',t:'Data',q:'Why must T-568A and T-568B **not** be mixed in one installation?',o:['They use different cable','The green and orange pairs swap pins, so data will not pass','T-568B is only for phones','They are different voltages'],a:1,w:'Pick one standard and stick to it. Mixed ends are only for crossover leads.'},
{p:'T2',t:'Underground',q:'Minimum clearance between underground **communication** cables and **power** cables?',o:['50 mm','100 mm','250 mm','450 mm'],a:1,w:'100 mm, or use a fire-retardant partition, or mechanical protection at crossings (ET101 528.2).'},
{p:'T2',t:'Underground',q:'Cable buried between two buildings must be…',o:['painted orange','marked with cable covers or warning tape','run above ground','single-core only'],a:1,w:'Plus protection against damage (or buried deep enough), and buried ducts identified.'},
{p:'T2',t:'Cables',q:'Recommended minimum bending radius of an **aluminium-sheathed** cable?',o:['4 × D','6 × D','10 × D','15 × D'],a:3,w:'r = 15 × D, where D is the outside diameter of the cable.'},

{p:'T2',t:'Lighting',q:'What does **DCL** stand for when connecting a luminaire?',o:['Direct Current Lamp','Device for Connecting a Luminaire','Double Contact Lampholder','Daylight Control Link'],a:1,w:'Luminaires connect via a box, a DCL outlet, or equipment designed for direct connection.'},
{p:'T2',t:'Bonding',q:'Supplementary bonding conductor where it is **not** mechanically protected — minimum size?',o:['1.5 mm²','2.5 mm²','4 mm²','10 mm²'],a:2,w:'4 mm² unprotected, 2.5 mm² where mechanically protected (ET101 544.2).'},

{p:'T2',t:'Conduit',q:'Steel conduit is used as the CPC. How many cables do you count per single-phase circuit?',o:['1','2 (L + N)','3 (L + N + CPC)','4'],a:1,w:'The conduit itself is the protective conductor, so only line and neutral are drawn in.'},
{p:'T2',t:'Conduit',q:'Cable factor for a stranded **2.5 mm²** PVC single-core in conduit (long runs/bends)?',o:['16','22','30','43'],a:2,w:'From the papers\' model answers: 1.5 mm² = 22, 2.5 mm² = 30 (Table 52J.3). Check against ET101.'},
{p:'T2',t:'Batteries',q:'A hydrometer measures the…',o:['battery voltage','specific gravity of the electrolyte','internal resistance','charging current'],a:1,w:'Fully charged lead-acid reads about 1.25–1.28.'},

{p:'T2',t:'Batteries',q:'Compared with lead-acid, Ni-Cad batteries are…',o:['heavier and cheaper','lighter, dearer, and last much longer','the same','only for cars'],a:1,w:'About 50–60 % lighter, higher initial cost, 25+ years life.'},
{p:'T2',t:'Emergency lighting',q:'**Annual** test of a 3-hour self-contained emergency light: run on battery for…',o:['10 minutes','30 minutes','1 hour','the full 3 hours'],a:3,w:'Quarterly: 30 min. Annual: full rated duration. Record everything in the logbook.'},

{p:'T2',t:'Storage heaters',q:'How does the supply authority control off-peak storage heating?',o:['By the customer\'s switch','With a sealed time switch on a separate circuit and an off-peak meter','By the MCB','By the boiler'],a:1,w:'Separate circuit, sealed time switch, separate meter.'},

{p:'T2',t:'Testing',q:'Equipment marked with the **double-square** symbol should…',o:['have a 10 mm² earth','NOT be earthed (Class II)','be bonded to the gas pipe','have an RCD only'],a:1,w:'Double-square = double insulated (Class II). No earth connection.'},
{p:'T2',t:'Testing',q:'Which of these is **not** one of the standard verification tests?',o:['Insulation resistance','Polarity','Earth fault loop impedance','Hydrometer test'],a:3,w:'Visual inspection, continuity of protective conductors, insulation resistance, polarity, earth fault loop impedance, RCD operation.'},

{p:'T2',s:1,m:2,t:'Motor couplings',q:'Flexible couplings: state the basic function, and how the motor is aligned to its load.',a:['Joins the motor shaft to the load shaft end to end, so both turn together','Absorbs shock, vibration and small misalignment (and allows for shaft expansion)','Align with a straight edge first, then check with a feeler gauge at 4 points 90° apart — all four gaps equal = aligned'],n:2},
{p:'T2',s:1,m:2,t:'Motor couplings',q:'State the TWO basic functions of a flexible coupling.',a:['Transmits power (torque) from one shaft to the other so both rotate together at the same speed','Compensates for small misalignment, movement and vibration between the two shafts']},
{p:'T2',s:1,m:2,t:'Motor couplings',q:'Two flanges directly couple a motor to its machine. Describe (with sketches) two types of misalignment and how to minimise them.',a:['Angular misalignment: the gap is wider on one side than the other (X ≠ Y)','Parallel (offset) misalignment: the shaft centres are offset by a distance P','Minimise both to within the manufacturer\'s tolerances (shim the feet, re-check with feeler gauge / dial gauge)'],n:2,fig:'misalign'},
{p:'T2',s:1,m:2,t:'Motor bearings',q:'Describe how to remove a worn bearing and fit a new one on a motor shaft.',a:['Remove with a bearing puller — do not bend or damage the shaft','Heating the bearing (not the shaft) helps it come off','Fit the new one with a press and sleeve pushing on the INNER race only','Make sure it is the right way round'],n:2},
{p:'T2',s:1,m:2,t:'Motor protection',q:'Where are thermistors located in the overcurrent protection of a 3-phase induction motor?',a:['Embedded in the motor windings','Wired to a thermistor control relay that opens the control circuit when the windings get too hot']},
{p:'T2',s:1,m:2,t:'Motor couplings',q:'Name two methods of coupling a motor to drive a load.',a:['Solid (direct) coupling','Flexible coupling','Vee-belt drive','Flat belt drive'],n:2},
// Slot 2: cable rules
{p:'T2',s:2,m:5,t:'Cable rules',q:'(a) How must AC cables entering a ferromagnetic enclosure be arranged? (b) PVC/PVC cable without armour buried in a solid wall: the 3 permitted methods?',a:['(a) All conductors of the circuit, including the CPC, in the same enclosure — only collectively surrounded by steel, never one per hole','(b) Within 150 mm of the room edges, or a straight horizontal/vertical run to the point or accessory','(b) Protected against harmful substances in plaster/concrete (PVC conduit or suitable sheath)','(b) Not less than 50 mm from the reverse side of the wall'],r:'ET101 521.5 · Table 52.1',c:1,fig:'zones'},
{p:'T2',s:2,m:5,t:'Cable rules',q:'(a) Which types of cable are recognised by CENELEC? (b) Colour code for multicore cables and cords on AC circuits?',a:['(a) Harmonised cables — carry the <HAR> mark plus the approval body (e.g. BASEC, VDE)','(a) Approved national types — marked on the sheath','(b) Line: brown (L1), black (L2), grey (L3)','(b) Blue = neutral (or mid-point) only','(b) Green/yellow = protective conductor only'],r:'ET101 514.3',c:1},
{p:'T2',s:2,m:2,t:'Cable rules',q:'(a) Flexible cables and cords — requirement regarding mechanical damage? (b) Separated circuits — what about their exposed-conductive-parts?',a:['(a) Must be visible along any part of their length liable to mechanical damage','(b) Must NOT be connected to the protective conductor, to exposed parts of other circuits, or to earth'],r:'ET101 413.3',c:1},
{p:'T2',s:2,m:2,t:'Lighting wiring',q:'State two methods of connecting luminaires to the fixed wiring.',a:['A box (to I.S. EN 60670)','A DCL outlet — Device for Connecting a Luminaire (I.S. EN 61995)','Equipment designed to be connected directly to the wiring system'],n:2,r:'ET101 559.5',c:1},
// Slot 3: data cabling & segregation
{p:'T2',s:3,m:3,t:'Data cabling',q:'Describe the construction of STP cable used in Cat6 structured cabling.',a:['4 pairs of insulated copper conductors','Each pair twisted, each with a different twist rate','Foil/metal shield around the pairs (that is the "S" in STP)','Overall outer jacket'],n:3},
{p:'T2',s:3,m:3,t:'Data cabling',q:'Describe the construction of UTP cable used in Cat5e structured cabling.',a:['4 pairs of insulated copper conductors','Each pair twisted, with different twist rates','NO shield (unshielded)','Overall outer jacket'],n:3},
{p:'T2',s:3,m:3,t:'Segregation',q:'Describe three ways low-voltage and extra-low-voltage (Band I & II) circuits can share a wiring system.',a:['Every cable insulated for the highest voltage present','Each core of a multicore insulated for the highest voltage in it','Separate compartment of trunking/ducting','Cable tray with a partition between them','Separate conduit or trunking system'],n:3,r:'ET101 528.1',c:1},
{p:'T2',s:3,m:3,t:'Underground cables',q:'Underground communication cables cross or run close to power cables: minimum clearance, and the alternatives?',a:['Keep at least 100 mm apart','OR a fire-retardant partition between them (bricks, clay/concrete cable covers, shaped blocks, fire-retardant conduit or troughs)','OR at crossings, mechanical protection between them (conduit, concrete caps or blocks)'],r:'ET101 528.2',c:1},
{p:'T2',s:3,m:3,t:'Solar PV',q:'Where must "Solar PV on roof" warning signs be placed?',a:['At the origin of the installation','At the metering position, if it is away from the origin','At the consumer unit / distribution board the inverter is connected to'],r:'ET101 712.514',c:1},
// Slot 4: aluminium & PVC
{p:'T2',s:4,m:4,t:'Aluminium cables',q:'Compare aluminium to copper: mechanical properties, cost, current-carrying capacity, conductivity.',a:['Weight: aluminium is about 3 × lighter — easier to handle, used for big and overhead cables','Cost: aluminium is cheaper, and its price is more stable','Conductivity: aluminium is only about 61 % of copper','So it needs a bigger size for the same current (about one size up, e.g. 25 mm² Al ≈ 16 mm² Cu)'],r:'Min Al size for power/lighting: check ET101 Table 52',c:1},
{p:'T2',s:4,m:2,t:'Cable rules',q:'PVC/PVC cable in a wall cavity likely to touch expanded polystyrene: what must be done?',a:['Do not let PVC stay in contact with expanded polystyrene (it draws out the plasticiser — PVC goes brittle)','Run it in conduit or another enclosure that polystyrene will not attack'],r:'ET101 522.5',c:1},
{p:'T2',s:4,m:2,t:'Aluminium cables',q:'Installing aluminium cable for power circuits: the requirement for the connectors?',a:['Connectors used to terminate aluminium conductors must be tested and approved for that specific use'],r:'ET101 524.1, Table 52.3 note',c:1},
{p:'T2',s:4,m:2,t:'Aluminium cables',q:'Recommended minimum bending radius for a cable with an aluminium sheath?',a:['r = 15 × D','D = the overall (outer) diameter of the cable (unless the manufacturer says otherwise)'],r:'ET101 Annex 52',c:1},
// Slot 5: capacity, volt drop, EMI, losses
{p:'T2',s:5,m:4,t:'Cable sizing',q:'(a) What determines the current-carrying capacity of a cable? (b) List four factors to consider.',a:['(a) Must not exceed the value from the Annex 52 tables, after correction factors are applied','(b) Ambient temperature','(b) Method of installation','(b) Grouping with other circuits','(b) Thermal insulation · load current · volt drop · fault loop impedance'],n:4,r:'ET101 523',c:1},
{p:'T2',s:5,m:2,t:'Data cabling',q:'How can data cabling be protected from electromagnetic interference (EMI)? Two methods.',a:['Use shielded (STP/screened) cable','Keep it separated from power cables — e.g. multi-compartment trunking','Earthed steel trunking around unshielded cable near sources of interference'],n:2},
{p:'T2',s:5,m:3,t:'Energy efficiency',q:'Cable I²R losses: state three ways to reduce them.',a:['Reduce the volt drop in the wiring','Increase the conductor cross-sectional area','Fit power factor correction','Reduce harmonic currents'],n:3,r:'ET101 8A',c:1},
{p:'T2',s:5,m:3,t:'Energy efficiency',q:'State three factors that affect I²R power losses in a cable.',a:['Cable length','Conductor cross-sectional area','The load current']},
{p:'T2',s:5,m:2,t:'Volt drop',q:'10 mm² cable, 40 m run, 38 A, 4.4 mV/A/m. Volt drop? Is it OK?',a:['Vd = mV/A/m × I × L ÷ 1000 = 4.4 × 38 × 40 ÷ 1000 = 6.688 V','Limit is 4 % of 230 V = 9.2 V → it complies','Practise more of these in the Formula Lab'],r:'mV/A/m from ET101 table',c:1},
// Slot 6: joints, discrimination, RCDs
{p:'T2',s:6,m:2,t:'Aluminium cables',q:'Describe the electrolytic effect between copper and aluminium, and how to prevent it.',a:['Moisture at an Al–Cu joint acts as an electrolyte → the aluminium corrodes quickly','Use bi-metallic (Al/Cu) lugs or connectors','Coat the joint with anti-oxidant paste/grease','Tin-plated Al lugs only in rooms that stay dry'],n:2},
{p:'T2',s:6,m:2,t:'Cable rules',q:'What does ET101 require when connecting dissimilar metals liable to cause electrolytic action?',a:['They must not be placed in contact unless special arrangements are made to avoid the effects of the contact','(Quote the rule — the examiner wants the regulation, not just "use a bi-metal lug")'],r:'ET101 522.5.2',c:1},
{p:'T2',s:6,m:4,t:'Aluminium cables',q:'State four precautions when connecting aluminium cables into copper busbars.',a:['Isolate — busbar and cable dead','Connection clean and dry (keep moisture off)','Use a bi-metallic lug, with contact grease inside','Tighten to the correct torque']},
{p:'T2',s:6,m:4,t:'Protection',q:'With a diagram, explain discrimination between protective devices.',a:['Devices are chosen so the one nearest the fault (on the supply side) operates first','Fault on a final circuit: only that circuit\'s fuse/MCB goes','Sub-board and main fuse stay in, so the rest of the building keeps power','Diagram: Supply → main fuse → sub-board fuse → final circuit fuse → fault X'],fig:'discrim'},
{p:'T2',s:6,m:3,t:'Protection',q:'An RCD is marked 32A / 30mA / AC. Explain each part.',a:['32 A — rated current it can carry continuously','30 mA — residual (earth leakage) current that trips it','AC — type: for loads with no significant DC component']},
{p:'T2',s:6,m:2,t:'Data cabling',q:'Why must T-568A and T-568B terminations not be mixed in one installation?',a:['The green and orange pairs swap pin positions between the two','Mixed ends → pairs do not line up at plugs and jacks → data signals will not transfer','Pick one (usually T-568B in Europe) and stay consistent — mixed ends only for crossover leads']},
{p:'T2',s:6,m:2,t:'Boards',q:'A wall-mounted DB has its bottom less than 1.4 m from the floor. What is required, and why?',a:['It must be accessible only to responsible persons (e.g. lockable)','Reason: to stop young children getting at it'],r:'ET101 530.6',c:1},
// Slot 7: DB drawing
{p:'T2',s:7,m:6,t:'Distribution board',q:'Draw the internal connections of a 3-phase DB: 3-phase heater, 3-phase motor, 4 lighting circuits, 2 socket circuits.',a:['Main switch / fuse-switch feeding L1, L2, L3 busbars + neutral bar + earth bar','3-phase loads: triple-pole (TP) MCB taking L1, L2 and L3','Single-phase loads spread across L1, L2, L3 to balance the phases','Sockets on RCBOs (RCD protection)','Every circuit clearly labelled, neutrals to N bar, CPCs to E bar'],n:4,fig:'dbsample'},
{p:'T2',s:7,m:6,t:'Distribution board',q:'Complete the DB drawing: heating (3-phase), lighting 1, lighting 2, printing machine — protected by fuses.',a:['Heating: a fuse in each of L1, L2, L3 (triple-pole)','Lighting 1, lighting 2 and the printing machine on different phases (balance)','Each single-phase fuse fed from its busbar; neutrals to N bar','Label every load'],n:3,fig:'dbsample'},
// Slot 8: MCBs & HBC
{p:'T2',s:8,m:1,t:'Protection',q:'On an MCB tripping curve, identify the maximum and minimum tripping curve regions.',a:['Minimum curve = the left/lower edge of the band (to the left it will not trip)','Maximum curve = the right/upper edge (to the right it will always trip)','Upper curved part = thermal (overload), the drop = magnetic (short circuit)'],n:2,fig:'mcb'},
{p:'T2',s:8,m:2,t:'Protection',q:'Why are MCBs backed up by HBC fuses in industrial installations? What does HBC mean?',a:['MCBs have a limited breaking (rupturing) capacity — may not clear very high fault currents','HBC = High Breaking Capacity']},
{p:'T2',s:8,m:4,t:'Protection',q:'Explain the purpose of an HBC fuse and draw its construction.',a:['Safely breaks very high fault currents; good discrimination; used as back-up','Ceramic body','Silver element (with notches/necks)','Quartz sand filler to quench the arc','Brass end caps and fixing tags · indicator'],n:4,fig:'hbc'},
{p:'T2',s:8,m:2,t:'Protection',q:'Which MCB/RCBO type for circuits with very high inrush current? What range of magnetic tripping can it ignore?',a:['Type B: trips at 3–5 × In — general/resistive loads','Type C: 5–10 × In — inductive loads (fluorescent lighting, small motors)','Type D: 10–20 × In — VERY high inrush (transformers, welders, big motors)'],n:1,r:'ET101 533.3',c:1},
{p:'T2',s:8,m:2,t:'Protection',q:'Short-circuit faults at A (near supply), B and C (far end). Where is the fault current lowest, and why?',a:['Lowest at C — the point furthest from the supply transformer','The further out the circuit, the higher the impedance → less fault current']},
// Slot 9: conduit factors & heights
{p:'T2',s:9,m:4,t:'Conduit capacity',q:'Steel conduit, 8 m run, 2 bends: 2 × 2.5 mm² circuits and 3 × 1.5 mm² circuits (stranded single-core). Conduit is the CPC. Cable factors and minimum conduit size?',a:['Conduit is the CPC → only L + N per circuit (2 cables each)','2.5 mm²: 4 cables × 30 = 120','1.5 mm²: 6 cables × 22 = 132','Total 252 → 25 mm conduit (factor 292) is enough'],r:'ET101 Tables 52J.3 & 52J.4 — your model answers are not consistent on this, check with the tutor',c:1},
{p:'T2',s:9,m:8,t:'Boards',q:'(a) Bell wires (ELV) inside a DB: precaution? (b) Diagram: mounting heights for switches, sockets and DB.',a:['(a) Sleeve ELV cables to the highest voltage in the board, or keep them physically separated','(b) Switches in dwellings: 400–1200 mm (public buildings 900–1200 mm)','(b) Sockets: 400–1200 mm above finished floor','(b) DB: top not more than 2.25 m; bottom not less than 1.4 m'],r:'ET101 530.5, 530.6, 554.1',c:1,fig:'heights'},
{p:'T2',s:9,m:6,t:'Boards',q:'Domestic DB: mounting height rules (with diagram) + four places it cannot go.',a:['Readily accessible; top ≤ 2.25 m, bottom ≥ 1.4 m','Not in a storage or airing cupboard','Not under timber stairs','Not in a bathroom, washroom or WC','Not above a cooker/heater, or where clothes could cover it'],n:5,r:'ET101 530.5',c:1,fig:'heights'},
{p:'T2',s:9,m:4,t:'Cable rules',q:'Four exemptions from mechanical protection for cables in hollow walls (partitions)?',a:['Within 150 mm (horizontally) of a room corner','Within 150 mm (vertically) of the ceiling','Straight horizontal or vertical run directly to an accessory, appliance or DB','At least 50 mm from the reverse side of the wall'],r:'ET101 522.6',c:1,fig:'zones'},
// Slot 10: rising mains & water
{p:'T2',s:10,m:6,t:'Busbars',q:'Describe three precautions when installing a rising main busbar system.',a:['Seal every floor penetration to the fire resistance of that floor (and fit internal fire barriers in the trunking)','Correct IP rating — no water or dust ingress; seal floors against water leaking between levels','Expansion joints in tall runs; adequate supports at the maker\'s spacing','Mechanical protection where needed'],n:3,r:'ET101 527.2, 522',c:1},
{p:'T2',s:10,m:6,t:'Busbars',q:'Six advantages of a rising main busbar system over cables in a multi-storey building.',a:['Strong over long runs with few fixings → faster to install','Replaces many cable runs and their supports','Easier to handle than lots of large cables','Less termination space in switchboards; no lugs except at the feeder','Takes up less space; bends and offsets fit tight areas','Type-tested fault ratings · lower volt drop · better fire resistance · can be reused'],n:6},
{p:'T2',s:10,m:4,t:'Cable rules',q:'Where water or high humidity may occur, what three requirements must the installer consider?',a:['No damage from condensation or water — IP rating suitable for the location','Provide a way for collected water/condensation to escape','Where waves may hit it, protect it against mechanical damage'],r:'ET101 522.3',c:1},
// Slot 11: underground
{p:'T2',s:11,m:2,t:'Underground cables',q:'Non-armoured cable in a pipe in the ground (industrial/commercial): type of pipe, and minimum depth?',a:['Pipe: high-density polythene, high-impact PVC, or spigotted concrete','Depth: your model answers differ — 450 mm (2021, 2024 papers) and 250 mm (2023 paper D). Check ET101 522.8 and ask the tutor which he wants'],c:1},
{p:'T2',s:11,m:2,t:'Underground cables',q:'Cable suitable for burying in a domestic garden, and minimum depth?',a:['SWA (steel wire armoured)','At least 450 mm (600 mm where the ground is likely to be dug, from your Q&A notes)'],c:1},
{p:'T2',s:11,m:3,t:'Underground cables',q:'Cable between two buildings, in the soil: precautions required?',a:['Protect against mechanical damage OR bury deep enough to minimise the risk','Mark buried cables with cable covers or marking tape','Buried conduits and ducts must be identified'],r:'ET101 522.8.10',c:1},
{p:'T2',s:11,m:2,t:'Underground cables',q:'Drawing cables into an underground duct: one advantage, one disadvantage.',a:['Advantage: repairs and additions from manholes without digging; cable need not be armoured; well protected','Disadvantage: higher initial cost; poorer heat dissipation → lower current rating'],n:2},
{p:'T2',s:11,m:3,t:'Underground cables',q:'Pulling large cables into a duct with rollers and jacks: three precautions.',a:['Jacks and rollers rated for the drum weight and width','Jacks on level ground, axle level','Rollers placed so the cable is not strained or damaged','Cable comes off the bottom of the drum so it cannot tip; use pulling lubricant on long runs with bends'],n:3},
{p:'T2',s:11,m:6,t:'Busbars',q:'Why are expansion joints fitted on long busbar runs? What fault if they are not?',a:['Busbars expand and contract with the heat from load current','Without joints the bars can warp → clearances to other bars/the case reduce','Constant movement loosens joints → high-resistance hot joints']},
// Slot 12: busbar trunking & bonding
{p:'T2',s:12,m:4,t:'Busbars',q:'(a) Overhead busbar trunking vs fixed wiring: one advantage, one disadvantage. (b) Minimum size of supplementary bonding conductor with underfloor busbar trunking?',a:['(a) Advantage: machines plugged in/out (tap-off units) without shutting down the rest','(a) Disadvantage: expensive to install at first','(b) 2.5 mm² copper where mechanically protected','(b) 4 mm² copper where NOT mechanically protected'],r:'ET101 544.2',c:1},
{p:'T2',s:12,m:2,t:'Busbars',q:'Underfloor / raised-floor power-track: one advantage, one disadvantage.',a:['Advantage: flexible when the floor layout is unknown; 13 A / 32 A tap-offs; modular floor boxes; clean-earth versions','Disadvantage: usually only up to 63 A; limited tap-offs; runs about 20 m max; proprietary parts can be hard to get'],n:2},
{p:'T2',s:12,m:2,t:'Busbars',q:'ET101 requirements for busbar trunking and powertrack systems?',a:['Busbar trunking to I.S. EN 60439-2; powertrack to I.S. EN 61534','Selected and installed to the manufacturer\'s instructions, allowing for external influences'],r:'ET101 521.4',c:1},
{p:'T2',s:12,m:2,t:'Trunking',q:'Give two reasons multi-compartment trunking is popular in commercial buildings.',a:['Keeps circuits of different voltage bands segregated (power, data, telecoms)','One neat run instead of several unsightly runs','Fast and easy to install'],n:2},
// Slot 13: batteries
{p:'T2',s:13,m:2,t:'Batteries',q:'Ten cells, 1.5 V each, 0.2 Ω internal resistance each, series, 4 Ω load. Current? + two recharging methods.',a:['I = (n × E) ÷ (R + n × r) = 15 ÷ (4 + 2) = 2.5 A','Recharging: constant current','Constant voltage'],r:'Practise in the Formula Lab'},
{p:'T2',s:13,m:4,t:'Batteries',q:'Testing lead-acid batteries for a large diesel generator: equipment, procedure and PPE.',a:['PPE: goggles, rubber gloves, heavy apron · ventilated room · no naked flames','Fully charge, disconnect, inspect; note voltage on a voltmeter','Load tester across terminals for 15 s — should stay above about 9.5 V (12 V battery)','Let it recover ~30 s, repeat; still above 9.5 V = good'],n:4},
{p:'T2',s:13,m:2,t:'Batteries',q:'VRLA (valve-regulated lead-acid) batteries: three handling precautions, and the charging method.',a:['Sealed, but the gel/paste inside is still corrosive if the case cracks — handle carefully, do not drop','Wear apron, gloves and goggles','Charging: constant voltage'],n:2},

 I:['I','i'],IR:['I<sub>R</sub>','i'],IL:['I<sub>L</sub>','i'],IC:['I<sub>C</sub>','i'],Iph:['I<sub>ph</sub>','i'],I0:['I<sub>0</sub>','i'],If:['I<sub>f</sub>','i'],
 R:['R','r'],r:['r','r'],Z:['Z','r'],XL:['X<sub>L</sub>','r'],XC:['X<sub>C</sub>','r'],L:['L','r'],C:['C','r'],

{id:'sync',t:'Motors',n:'Synchronous speed & slip',make(){const P=pick([2,4,6,8]);const ns=120*50/P;const nr=pick({2:[2850,2880,2900,2940],4:[1420,1440,1450,1460,1470],6:[940,950,960,970],8:[705,720,730]}[P]);const s=(ns-nr)/ns*100;
 return{given:[G('p',P,''),G('f',50,'Hz'),G('nr',nr,'rpm')],ask:'Find the percentage slip',ans:s,unit:'%',steps:[`{ns} = 120 × {f} ÷ poles = 120 × 50 ÷ ${P} = ${ns} rpm`,`{s} = ({ns} − {nr}) ÷ {ns} × 100`,`= (${ns} − ${nr}) ÷ ${ns} × 100 = <b>${n3(s)} %</b>`]}}},
{id:'rotor',t:'Motors',n:'Rotor speed from slip',make(){const P=pick([4,6,8]);const s=pick([3,4,4.5,5,6]);const ns=6000/P;const nr=ns*(1-s/100);

{id:'torque',t:'Motors',n:'Motor torque',make(){const P=pick([5.5,7.5,10.5,15,22]);const n=pick([1420,1440,1450,960,2900]);const T=P*1000/(TAU*n/60);

{id:'res',t:'AC circuits',n:'Resonant frequency',make(){const L=pick([0.1,0.2,0.3,0.398,0.5]);const C=pick([6.37,10,22,47,100]);const f=1/(TAU*Math.sqrt(L*C*1e-6));

{id:'par',t:'AC circuits',n:'Parallel R–L–C: supply current',make(){const IR=pick([5,8,9.2,12,15]);const IL=pick([6,11.5,15,18.5,20]);let IC=pick([3,8,15.33,26.5,10]);if(IC===IL)IC+=2;const I=Math.hypot(IR,IC-IL);const lead=IC>IL;
 return{given:[G('IR',IR,'A'),G('IL',IL,'A'),G('IC',IC,'A')],ask:'Find the supply current',ans:I,unit:'A',steps:[`{IC} and {IL} are opposite, so subtract: ${IC} − ${IL} = ${n3(IC-IL)} A`,`{I} = √({IR}² + ({IC} − {IL})²) = √(${IR}² + ${n3(IC-IL)}²)`,`= <b>${n3(I)} A</b>`,`{pf} = {IR} ÷ {I} = ${n3(IR/I)} ${lead?'leading (I<sub>C</sub> bigger)':'lagging (I<sub>L</sub> bigger)'}`]}}},
{id:'tau',t:'DC & capacitors',n:'Capacitor time constant',make(){const C=pick([5,10,22,47,68,100]);const R=pick([10,22,47,100,470]);const t=C*1e-6*R*1e3;
 return{given:[G('C',C,'µF'),G('R',R,'kΩ')],ask:'Find the time constant',ans:t,unit:'s',steps:[`{tau} = {R} × {C}`,`= ${R}×10³ × ${C}×10⁻⁶`,`= <b>${n3(t)} s</b> (fully charged after about 5{tau} = ${n3(5*t)} s)`]}}},
{id:'i0',t:'DC & capacitors',n:'Initial charging current',make(){const R=pick([10,22,47,100,500]);const V=pick([12,24,48,100]);const I=V/(R*1e3)*1000;

{id:'flux',t:'Magnetism',n:'Flux density',make(){const F=pick([0.005,0.01,0.015,0.02,0.03]);const A=pick([100,120,150,200,250]);const B=F/(A/1e4);
 return{given:[G('Phi',F,'Wb'),G('A',A,'cm²')],ask:'Find the flux density',ans:B,unit:'T',steps:[`Convert area: ${A} cm² ÷ 10,000 = ${A/1e4} m²`,`{B} = {Phi} ÷ {A} = ${F} ÷ ${A/1e4}`,`= <b>${n3(B)} T</b>`]}}},
{id:'vd',t:'Cables',n:'Volt drop (T2)',make(){const c=pick([[1.5,29],[2.5,18],[4,11],[6,7.3],[10,4.4],[16,2.8]]);const I=pick([14,18,25,32,38,40]);const L=pick([12,20,25,30,40,50]);const vd=c[1]*I*L/1000;const ok=vd<=9.2;

{id:'led',t:'Electronics',n:'LED series resistor',make(){const Vs=pick([12,24,48]);const Vf=pick([1.8,2,2.2,3.2]);const If=pick([10,15,20,25]);const R=(Vs-Vf)/(If/1000);

function renderBoard(msg){

   <p class="small muted" style="margin:0">Choose the protective device and busbar for each load. The drawing updates as you go — this is what you draw in the exam.</p>

    return `<div class="panel bbrow" style="padding:12px"><div class="row" style="justify-content:space-between"><b>${n}</b><span class="chip">${three?'3-phase':'single-phase'}${t==='1s'?' socket':''}</span></div>
    ${devs.length?`<div class="seg sm" data-i="${i}" data-f="dev">${devs.map(([k,l])=>`<button data-k="${k}" class="${a.dev===k?'on':''}">${l}</button>`).join('')}</div>`:''}
    ${three?'':`<div class="seg sm" data-i="${i}" data-f="bar">${['L1','L2','L3'].map(k=>`<button data-k="${k}" class="${a.bar===k?'on':''}">${k}</button>`).join('')}</div>`}</div>`}).join('')}</div>
  <div id="bbmsg">${msg||''}</div>
  <div class="row"><button class="btn" style="flex:1" id="bbcheck">Check my board</button><button class="btn ghost" style="flex:1" id="bbmodel">Show model answer</button></div>
  <section class="note">Exam tips: draw the main switch and the L1, L2, L3, N and E bars. Use triple-pole devices for 3-phase loads, spread single-phase loads evenly across the phases, put sockets on RCBOs, and label every circuit.</section>
  </div>`;
  $('#bbsel').onchange=e=>viewBoard(e.target.value);
  document.querySelectorAll('.seg.sm').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;BB.asg[+g.dataset.i][g.dataset.f]=b.dataset.k;renderBoard()});
  $('#bbcheck').onclick=checkBoard;
  $('#bbmodel').onclick=()=>{BB.asg=modelAssign(sc);renderBoard('<div class="feedback"><b>Model answer</b>: 3-phase loads on triple-pole devices, single-phase loads rotated L1 → L2 → L3, sockets on RCBOs.</div>')};
}
function checkBoard(){
  const {sc,asg}=BB;const issues=[];
  sc.loads.forEach(([n,t],i)=>{const a=asg[i];
    if(t==='3'&&a.dev!=='TP')issues.push(`${n}: a 3-phase load needs a triple-pole device across L1, L2 and L3.`);
    if(t!=='3'&&!a.bar)issues.push(`${n}: pick which phase it is on.`);
    if(t!=='3'&&sc.prot!=='fuse'&&!a.dev)issues.push(`${n}: pick MCB or RCBO.`);
    if(t==='1s'&&a.dev&&a.dev!=='RCBO')issues.push(`${n}: socket circuits should have RCD protection — use an RCBO.`);
  });
  const cnt={L1:0,L2:0,L3:0};asg.forEach(a=>{if(cnt[a.bar]!=null)cnt[a.bar]++});
  const v=Object.values(cnt);if(asg.every((a,i)=>sc.loads[i][1]==='3'||a.bar)&&Math.max(...v)-Math.min(...v)>1)issues.push(`Phases are not balanced (L1: ${cnt.L1}, L2: ${cnt.L2}, L3: ${cnt.L3}). Spread the single-phase loads out.`);
  if(!issues.length){addXP(20);renderBoard('<div class="feedback"><b>Board passes</b>. Balanced phases, right devices. Now draw it on paper from memory.</div>')}
  else renderBoard(`<div class="feedback no stack" style="gap:4px"><b>Not yet</b>${issues.map(x=>`<div>• ${x}</div>`).join('')}</div>`);
}

function startQuiz(mode){

  if(Q.timed){quizTimer=setInterval(()=>{Q.left--;const t=$('#qclock');if(t)t.textContent=fmtT(Q.left);if(Q.left<=0){clearInterval(quizTimer);endQuiz()}},1000)}
  showQ();
}
const fmtT=s=>`${Math.floor(Math.max(0,s)/60)}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
function showQ(){
  const it=Q.items[Q.i];if(!it)return endQuiz();
  const q=it.q;sayTexts.q=q.q+'. '+it.order.map((oi,k)=>'ABCD'[k]+'. '+q.o[oi]).join('. ');
  view.innerHTML=`<div class="stack">

    <div class="row"><span class="chip ${q.p.toLowerCase()}">${q.p}</span><span class="chip">${q.t}</span>${Q.streak>=3?`<span class="chip chk">${Q.streak} in a row</span>`:''}</div>

    <div>${sayBtn('q')}</div>
  </section>
  <div class="opts" id="opts">${it.order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="let">${'ABCD'[k]}</span><span>${q.o[oi]}</span></button>`).join('')}</div>
  <div id="fb"></div></div>`;
  $('#opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;answer(+b.dataset.oi)};

function answer(oi){
  const it=Q.items[Q.i],q=it.q,ok=oi===q.a;
  Q.res[Q.i]=ok;S.answered++;
  const gi=MCQ.indexOf(q);
  if(ok){S.correct++;Q.streak++;addXP(10+(Q.streak>=3?5:0));S.missed=S.missed.filter(x=>x!==gi)}
  else{Q.streak=0;if(!S.missed.includes(gi))S.missed.push(gi)}
  save();
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const v=+b.dataset.oi;if(v===q.a)b.classList.add('right');else if(v===oi)b.classList.add('wrong');else b.classList.add('dim')});
  sayTexts.w=q.w;
  $('#fb').innerHTML=`<div class="feedback ${ok?'':'no'} stack" style="gap:6px"><b>${ok?'Correct':'Not quite'}</b><div>${q.w}</div><div>${sayBtn('w')}</div></div>

  $('#next').onclick=()=>{Q.i++;showQ()};$('#next').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function endQuiz(){
