  const topics=[...new Set(gens.map(g=>g.t))];
  view.innerHTML=`<div class="stack"><section class="panel stack">
  <h2>Formula Lab</h2><p class="muted" style="margin:0">New numbers every time. Try it, then reveal the steps one at a time.</p>
  <div class="seg" id="lp">${[['T2','T2 calcs'],['T1','T1 calcs'],['all','All']].map(([k,l])=>`<button data-k="${k}" class="${k===pf?'on':''}">${l}</button>`).join('')}</div>
  <button class="btn full" id="mix">Random mix (${pf==='all'?'all':pf})</button></section>
  ${topics.map(t=>`<section class="stack" style="gap:8px"><h3>${t}</h3><div class="lablist">${gens.filter(g=>g.t===t).map(g=>`<button class="labitem" data-id="${g.id}"><span>${g.n}</span><small>Start ›</small></button>`).join('')}</div></section>`).join('')}</div>`;
  $('#lp').onclick=e=>{const b=e.target.closest('button');if(!b)return;store.set('labp',b.dataset.k);viewLab()};
  $('#mix').onclick=()=>startLab(null,pf);
  view.querySelectorAll('.labitem').forEach(b=>b.onclick=()=>startLab(b.dataset.id));
}
function startLab(id,pf){
  if(location.hash!=='#lab')history.replaceState(null,'','#lab');
  document.querySelectorAll('nav.bottom a').forEach(a=>a.classList.toggle('on',a.dataset.v==='lab'));
  LAB={id,pf:pf||'all',count:0,right:0};nextLab()}
function nextLab(){
  const pool=GENS.filter(g=>LAB.pf==='all'||g.p===LAB.pf);
  const g=LAB.id?GENS.find(x=>x.id===LAB.id):pick(pool);
  const p=g.make();LAB.cur={g,p,tries:0,done:false};
  const gl=x=>(SYM[x.k]?SYM[x.k][0]:x.k).replace(/<[^>]+>/g,'');
  sayTexts.lab=p.ask+'. Given: '+p.given.map(x=>gl(x)+' equals '+x.val+' '+x.unit).join(', ');
  view.innerHTML=`<div class="stack">
  <div class="qhead"><button class="btn ghost" onclick="go('lab')" style="min-height:44px">‹ All formulas</button><span class="small muted">${LAB.right}/${LAB.count} right${LAB.id?'':' · mix'}</span></div>
  <section class="panel stack">
   <div class="row"><span class="chip ${g.p.toLowerCase()}">${g.p}</span><span class="chip">${g.t}</span></div>
   <div class="qtext">${p.ask}</div>
   <div class="given">${p.given.map(x=>{const s=SYM[x.k]||[x.k,'k'];return `<div class="gv ${s[1]}"><small>given</small>${sy(x.k)} = <b>${x.val}</b> ${x.unit}</div>`}).join('')}</div>
   <div>${sayBtn('lab')}</div>
  </section>
  <section class="panel stack">
   <label for="ans" class="small muted">Your answer (3 decimal places)</label>
   <div class="ansrow"><input id="ans" inputmode="decimal" autocomplete="off" placeholder="e.g. 4.205">${p.unit?`<span class="unit">${p.unit}</span>`:''}</div>
   <div class="row"><button class="btn" id="chk" style="flex:1">Check</button><button class="btn ghost" id="hint" style="flex:1">Show next step</button></div>
   <div id="lfb"></div>
  </section>
  <section class="panel stack"><h3>Working</h3><ol class="steps" id="steps">${p.steps.map(s=>`<li class="hid">${fx(s)}</li>`).join('')}</ol><div class="small muted" id="stepnote">Steps are hidden. Tap “Show next step” if you get stuck.</div></section>
  </div>`;
  const inp=$('#ans');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  $('#chk').onclick=check;
  $('#hint').onclick=()=>revealStep();
  function revealStep(all){const lis=[...document.querySelectorAll('#steps li')];if(all)lis.forEach(l=>l.classList.remove('hid'));else{const h=lis.find(l=>l.classList.contains('hid'));if(h)h.classList.remove('hid')}if(!lis.some(l=>l.classList.contains('hid')))$('#stepnote').classList.add('hidden')}
  function check(){
    const c=LAB.cur;if(c.done){nextLab();return}
    const v=parseFloat(inp.value.replace(',','.').replace(/[^0-9.\-eE]/g,''));
    if(isNaN(v)){$('#lfb').innerHTML='<div class="feedback no">Type a number first.</div>';return}
    c.tries++;const a=c.p.ans;const ok=Math.abs(v-a)<=Math.max(0.0015,Math.abs(a)*0.005);
    if(ok||c.tries>=2){
      c.done=true;LAB.count++;if(ok){LAB.right++;addXP(15);S.answered++;S.correct++}else{S.answered++}save();
      revealStep(true);
      $('#lfb').innerHTML=`<div class="feedback ${ok?'':'no'}"><b>${ok?'Spot on':'Answer'}</b>: ${n3(a)} ${c.p.unit}${ok?'':' — check the working below.'}</div>`;
      $('#chk').textContent='Next problem';$('#hint').classList.add('hidden');
    } else {
      $('#lfb').innerHTML='<div class="feedback no"><b>Not yet.</b> Have one more go — or show a step.</div>';
    }
  }
}

/* ---------- FLASHCARDS (Leitner boxes) ---------- */
let FC=null;
function viewCardsSetup(){
  const deck=store.get('fdeck','T2');
  const cnt=b=>CARDS.filter((c,i)=>(deck==='all'||c.p===deck)&&(S.boxes[i]||0)===b).length;
  view.innerHTML=`<div class="stack"><section class="panel stack">
  <h2>Flashcards</h2><p class="muted" style="margin:0">Read the question, say your answer out loud, then flip. Answers are key points — the words examiners look for.</p>
  <div class="seg" id="fd">${[['T2','T2 written'],['T1','T1 explain'],['all','All']].map(([k,l])=>`<button data-k="${k}" class="${k===deck?'on':''}">${l}</button>`).join('')}</div>
  <div class="boxes"><span><b>${cnt(0)}</b>New</span><span><b>${cnt(1)}</b>Learning</span><span><b>${cnt(2)}</b>Nearly</span><span><b>${cnt(3)}</b>Known</span></div>
  <button class="btn full" id="fgo">Start 10 cards</button>
  ${deck==='T2'?'<button class="btn ghost full" onclick="go(\'t2\')">Pick by question number (paper map)</button>':''}
  </section>
  <section class="note">Cards marked <span class="chip chk">Check ET101</span> come from the regs. Your past-paper answers sometimes disagree with each other, so check those against the ET101 book.</section></div>`;
  $('#fd').onclick=e=>{const b=e.target.closest('button');if(!b)return;store.set('fdeck',b.dataset.k);viewCardsSetup()};
  $('#fgo').onclick=()=>{
    const idx=CARDS.map((c,i)=>i).filter(i=>deck==='all'||CARDS[i].p===deck);
    const sorted=shuffle(idx).sort((a,b)=>(S.boxes[a]||0)-(S.boxes[b]||0));
    FC={list:sorted.slice(0,10),i:0,flipped:false,again:[],back:viewCardsSetup};showCard();
  };
}
function showCard(){
  if(FC.i>=FC.list.length){
    if(FC.again.length){FC.list=FC.list.concat(FC.again);FC.again=[]}else return endCards();
  }
  const ci=FC.list[FC.i],c=CARDS[ci];
  sayTexts.fq=c.q;sayTexts.fa=c.a.join('. ');
  view.innerHTML=`<div class="stack">
  <div class="qhead"><span class="small muted">Card ${Math.min(FC.i+1,FC.list.length)} of ${FC.list.length}</span><button class="btn ghost" style="min-height:44px" id="fend">End</button></div>
  <section class="panel card" id="card">
    <div class="row"><span class="chip ${c.p.toLowerCase()}">${c.p}${c.s?' · Q'+c.s:''}</span>${c.m?`<span class="chip">${c.m} mark${c.m>1?'s':''}</span>`:''}<span class="chip">${c.t}</span>${c.c?'<span class="chip chk">Check ET101</span>':''}</div>
    <div class="qtext">${c.q}</div>
    <div>${sayBtn('fq')}</div>
    <div id="back" class="${FC.flipped?'':'hidden'} stack">
      ${c.fig&&DIAG[c.fig]?DIAG[c.fig].svg:''}
      <ul>${c.a.map(x=>`<li>${x}</li>`).join('')}</ul>
      ${c.n&&c.n<c.a.length?`<div class="ref">Any ${c.n} of these for full marks.</div>`:''}
      ${c.r?`<div class="ref">Reference: ${c.r}</div>`:''}
      <div>${sayBtn('fa')}</div>
    </div>
  </section>
  <div id="ctl">${FC.flipped?rateHTML():'<button class="btn full" id="flip">Show answer</button>'}</div></div>`;
  $('#fend').onclick=()=>(FC.back||viewCardsSetup)();
  if(!FC.flipped)$('#flip').onclick=()=>{FC.flipped=true;showCard()};
  else bindRate(ci);
}
function rateHTML(){return `<div class="rate"><button class="btn r-again" data-r="0">Again</button><button class="btn r-ok" data-r="1">Nearly</button><button class="btn r-good" data-r="2">Got it</button></div>`}
function bindRate(ci){document.querySelectorAll('.rate .btn').forEach(b=>b.onclick=()=>{
  const r=+b.dataset.r;const box=S.boxes[ci]||0;
  if(r===0){S.boxes[ci]=1;FC.again.push(ci)}else if(r===1){S.boxes[ci]=Math.max(1,Math.min(2,box))}else{S.boxes[ci]=Math.min(3,box+1);addXP(5)}
  save();FC.i++;FC.flipped=false;showCard();
})}
function endCards(){view.innerHTML=`<div class="stack"><section class="panel stack" style="text-align:center"><div class="big">Done</div><h2>Deck finished</h2><p class="muted" style="margin:0">Cards you marked “Again” came back round until you had them.</p></section><button class="btn full" id="fback">Back</button></div>`;$('#fback').onclick=()=>(FC.back||viewCardsSetup)()}

/* ---------- PICTURES: diagrams ---------- */
function viewPictures(){
  const ent=Object.entries(DIAG).sort((a,b)=>(a[1].t.startsWith('T2')?0:1)-(b[1].t.startsWith('T2')?0:1));
  view.innerHTML=`<div class="stack"><section class="panel stack"><h2>Diagrams</h2><p class="muted" style="margin:0">These are the drawings the papers ask for. T2 first. Open one, hide the labels, and name each part before you tap it.</p></section>
  <div class="dglist">${ent.map(([k,d])=>`<button class="dgthumb" data-k="${k}">${d.svg}<b>${d.n}</b><span class="small muted">${d.t}</span></button>`).join('')}</div>
  <button class="btn ghost full" onclick="go('snap')">Play Symbol Snap ›</button></div>`;
  view.querySelectorAll('.dgthumb').forEach(b=>b.onclick=()=>openDiagram(b.dataset.k));
}
function openDiagram(k){
  const d=DIAG[k];
  view.innerHTML=`<div class="stack">
  <div class="qhead"><button class="btn ghost" style="min-height:44px" onclick="viewPictures()">‹ All diagrams</button><span class="chip">${d.t}</span></div>
  <section class="panel stack"><h2>${d.n}</h2>
   <div class="seg" id="lm"><button class="on" data-k="show">Show labels</button><button data-k="hide">Test me (hide labels)</button></div>
   <div id="dgw" style="overflow-x:auto">${d.svg}</div>
   <div class="small muted" id="dgnote">Practise drawing this on paper, then compare.</div>
  </section></div>`;
  addCovers($('#dgw svg'));
  $('#lm').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    $('#lm').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    const hide=b.dataset.k==='hide';$('#dgw').classList.toggle('hidelabels',hide);
    $('#dgw').querySelectorAll('.lab').forEach(l=>l.classList.remove('shown'));
    $('#dgnote').textContent=hide?'Say what each orange box is, then tap it to check.':'Practise drawing this on paper, then compare.';
  };
  $('#dgw').addEventListener('click',e=>{const l=e.target.closest('.lab');if(l&&$('#dgw').classList.contains('hidelabels'))l.classList.add('shown')});
}
function addCovers(svg){
  svg.querySelectorAll('.lab').forEach(g=>{
    const t=g.querySelector('text');let bb;try{bb=t.getBBox()}catch(e){return}
    if(!bb.width)return;
    const ns='http://www.w3.org/2000/svg';
    const r=document.createElementNS(ns,'rect');r.setAttribute('x',bb.x-4);r.setAttribute('y',bb.y-2);r.setAttribute('width',bb.width+8);r.setAttribute('height',bb.height+4);r.setAttribute('class','cover');r.setAttribute('rx','5');
    const q=document.createElementNS(ns,'text');q.setAttribute('x',bb.x+bb.width/2);q.setAttribute('y',bb.y+bb.height/2+4);q.setAttribute('text-anchor','middle');q.setAttribute('class','qm');q.textContent='?';
    g.insertBefore(r,t);g.appendChild(q);
  });
}

/* ---------- SYMBOL SNAP ---------- */
let SN=null;
function viewSnapSetup(){
  const best=store.get('snapBest',0);
  view.innerHTML=`<div class="stack"><section class="panel stack" style="text-align:center">
  <h2>Symbol Snap</h2><p class="muted" style="margin:0">60 seconds. A symbol appears — tap its name. Wrong answers cost 3 seconds.</p>
  <div class="symbox">${SYMBOLS[6].s}</div>
  <div class="small muted">Best score: <b>${best}</b></div>
  <button class="btn full" id="sgo">Start</button>
  <button class="btn ghost full" id="slearn">Learn the symbols first</button></section></div>`;
  $('#sgo').onclick=startSnap;
  $('#slearn').onclick=()=>{view.innerHTML=`<div class="stack"><div class="qhead"><button class="btn ghost" style="min-height:44px" onclick="viewSnapSetup()">‹ Back</button></div><div class="dglist">${SYMBOLS.map(s=>`<div class="dgthumb" style="cursor:default"><div class="symbox" style="min-height:110px;padding:10px">${s.s}</div><b>${s.n}</b></div>`).join('')}</div></div>`};
}
function startSnap(){
  if(location.hash!=='#snap')history.replaceState(null,'','#snap');
  SN={left:60,score:0,last:-1};
  snapTimer=setInterval(()=>{SN.left--;const t=$('#sclock');if(t)t.textContent=SN.left+'s';if(SN.left<=0)endSnap()},1000);
  nextSnap();
}
function nextSnap(){
  let i;do{i=Math.floor(Math.random()*SYMBOLS.length)}while(i===SN.last);SN.last=i;
  const opts=shuffle([i,...shuffle(SYMBOLS.map((_,k)=>k).filter(k=>k!==i)).slice(0,3)]);
  view.innerHTML=`<div class="stack"><div class="qhead"><span class="timer" id="sclock">${SN.left}s</span><span class="chip chk">Score ${SN.score}</span></div>
  <div class="symbox">${SYMBOLS[i].s}</div>
  <div class="opts" id="sopts">${opts.map(k=>`<button class="opt" data-k="${k}"><span>${SYMBOLS[k].n}</span></button>`).join('')}</div></div>`;
  $('#sopts').onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;const k=+b.dataset.k;
    document.querySelectorAll('#sopts .opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===i)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    if(k===i){SN.score++;addXP(2)}else{SN.left=Math.max(0,SN.left-3)}
    setTimeout(()=>{if(SN.left>0)nextSnap()},k===i?350:1100);
  };
}
function endSnap(){
  clearInterval(snapTimer);const best=store.get('snapBest',0);const nb=SN.score>best;if(nb)store.set('snapBest',SN.score);
  view.innerHTML=`<div class="stack"><section class="panel stack" style="text-align:center"><div class="big">${SN.score}</div><h2>${nb?'New best score':'Time up'}</h2><div class="small muted">Best: ${Math.max(best,SN.score)}</div></section>
  <div class="row"><button class="btn" style="flex:1" onclick="startSnap()">Play again</button><button class="btn ghost" style="flex:1" onclick="go('pictures')">Diagrams</button></div></div>`;
}

route();

</script>
